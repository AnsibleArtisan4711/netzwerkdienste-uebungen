{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ]
    },
    "lease-database": {
      "type": "memfile",
      "persist": false
    },
    "valid-lifetime": 600,
    "option-data": [
      { "name": "domain-name-servers", "data": "192.168.20.99" }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.20.0/24",
        "pools": [ { "pool": "192.168.20.200 - 192.168.20.220" } ],
        "option-data": [
          { "name": "routers", "data": "192.168.20.99" }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
