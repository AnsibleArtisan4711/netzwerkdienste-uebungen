{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [ "eth0" ]
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases6.csv",
      "lfc-interval": 3600
    },
    "preferred-lifetime": 3000,
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "option-data": [
      { "name": "dns-servers", "data": "fd00:10::10" }
    ],
    "subnet6": [
      {
        "id": 1,
        "subnet": "fd00:30::/64",
        "pools": [ { "pool": "fd00:30::100 - fd00:30::1ff" } ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
