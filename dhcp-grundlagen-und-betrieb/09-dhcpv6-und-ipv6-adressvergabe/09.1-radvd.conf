# /etc/radvd.conf auf RTR-LIN (Uebung 09.1)
# Router Advertisement fuer Netz B (Interface net-b): Praefix fd00:20::/64.
# AdvManagedFlag on      -> Clients sollen Adressen per DHCPv6 holen (M-Flag)
# AdvOtherConfigFlag on  -> Clients sollen weitere Optionen per DHCPv6 holen (O-Flag)
# AdvAutonomous off      -> keine Adresse per SLAAC aus diesem Praefix
interface net-b
{
    AdvSendAdvert on;
    AdvManagedFlag on;
    AdvOtherConfigFlag on;
    prefix fd00:20::/64
    {
        AdvOnLink on;
        AdvAutonomous off;
    };
};
