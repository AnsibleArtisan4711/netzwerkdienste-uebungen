{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "eth0"
      ]
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "valid-lifetime": 28800,
    "renew-timer": 14400,
    "rebind-timer": 25200,
    "option-data": [
      {
        "name": "domain-name-servers",
        "data": "192.168.10.10"
      },
      {
        "name": "domain-name",
        "data": "corp.example.com"
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.30.0/24",
        "pools": [
          {
            "pool": "192.168.30.100 - 192.168.30.199"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "192.168.30.1"
          }
        ],
        "reservations": [
          {
            "hw-address": "aa:bb:cc:dd:ee:01",
            "ip-address": "192.168.30.50",
            "hostname": "cli-lin-b"
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          {
            "output": "stdout"
          }
        ],
        "severity": "INFO"
      }
    ]
  }
}
